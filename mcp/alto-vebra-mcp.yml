safety_notes:
- Write tools mutate a live estate agency CRM of record — contacts, offers, tenancies and work orders
  are legally significant records. Treat every non-GET tool as requiring confirmation.
- create_lead, create_contact, create_appraisal, create_work_order and create_media_item have no idempotency
  key; a retried call creates a duplicate. Alto answers 409 with a Location header on some resources only.
- The Zoopla activation tools spend money — Premium Listing and WFP activations are billable products
  under the customer contract.
- GET /contacts/{contactId}/bank-accounts returns landlord/tenant bank details and is gated behind its
  own semantic scope (alto/read:contact_bank_accounts). Exclude it from any general-purpose agent surface.
