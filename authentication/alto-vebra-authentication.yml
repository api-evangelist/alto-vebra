  - urn:ietf:params:oauth:grant-type:jwt-bearer
  dpop_supported: true
inbound_callback_auth:
  description: >-
    Alto authenticates ITSELF to the partner when delivering webhooks; the partner chooses the
    method during onboarding. Documented at https://developers.vebraalto.com/guides/webhooks/.
  methods:
  - type: apiKey
    header: x-signature
    description: Shared secret presented by Alto on each callback.
  - type: http
    scheme: basic
    description: HTTP Basic username/password issued to Alto during onboarding.
  - type: oauth2
    flow: clientCredentials
    description: Alto obtains a bearer token from the partner's own authorization server.
  zoopla_push:
    docs: https://developers.zoopla.co.uk/leads/docs/push-service
    methods:
    - type: oauth2
      flow: clientCredentials
      description: Zoopla calls a token endpoint the partner supplies, then sends Authorization
        Bearer.
    - type: apiKey
      header: Authorization
      description: Key used verbatim as the Authorization header value.
gaps:
- No mutualTLS, no openIdConnect scheme and no PKCE anywhere on the API surface — every path is
  machine-to-machine client credentials.
- Neither the Alto nor the Zoopla token endpoint publishes RFC 8414 metadata; the only discovery
  document in the estate belongs to the human-login Auth0 tenant.
- The Alto OpenAPI models the Bearer JWT as an apiKey scheme, so generated clients will not know
  a token endpoint exists.
