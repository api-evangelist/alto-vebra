  schemas:
    CloudEvent:
      type: object
      description: CloudEvents 1.0 JSON envelope as published in the Alto webhooks guide.
      required:
      - specversion
      - id
      - type
      - source
      - subject
      - time
      - datacontenttype
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
          description: The CloudEvents specification version. Always 1.0.
        id:
          type: string
          description: Unique identifier for this notification, formatted "<event-uuid>|<integrationId>".
            Stable across retries of the same notification — use it to de-duplicate.
          examples:
          - b1e9b0f0-1c2d-4e3f-9a8b-7c6d5e4f3a2b|11111111-2222-3333-4444-555555555555
        type:
          type: string
          description: The event type that was raised.
        source:
          type: string
          const: alto
          description: The system that produced the event. Always "alto".
        subject:
          type: string
          description: Relative URI identifying the resource that changed. Combine with the Alto API base
            URL to re-fetch it.
          examples:
          - /inventory/123456
        time:
          type: string
          format: date-time
          description: The time the originating change occurred, in UTC (ISO 8601).
        datacontenttype:
          type: string
          const: application/json
        data:
          $ref: '#/components/schemas/EventData'
    EventData:
      type: object
      description: Details needed to identify and retrieve the changed resource.
      required:
      - integrationId
      - agencyRef
      - subjectId
      properties:
        integrationId:
          type: string
          description: Identifier of the receiving integration. Use it to route when one endpoint serves
            more than one integration.
        agencyRef:
          type: string
          description: The agency reference associated with the change. Use it as the AgencyRef header
            when calling the Alto REST API.
        branchId:
          type: string
          description: Identifier of the branch the resource belongs to, where applicable.
        subjectId:
          type: string
          description: Identifier of the resource that changed; also the final segment of `subject`.
        relatedSubjects:
          type: array
          description: Related resources, each with its own subjectUri and subjectId. May be empty.
          items:
            type: object
            properties:
              subjectUri:
                type: string
              subjectId:
                type: string
      examples:
      - integrationId: 11111111-2222-3333-4444-555555555555
        agencyRef: YOUR_AGENCY_REF
        branchId: '2681'
        subjectId: '123456'
        relatedSubjects: []
