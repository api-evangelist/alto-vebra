asyncapi: 3.0.0
id: urn:apievangelist:alto-vebra:webhooks
info:
  title: Alto Webhooks
  version: 1.0.0
  description: 'Event notifications Alto delivers to a partner-hosted HTTPS endpoint when data changes
    in an Alto agency tenancy. Faithfully transcribed by API Evangelist from the webhook catalogue Alto
    publishes at https://developers.vebraalto.com/guides/webhooks/ — Alto itself publishes no AsyncAPI
    document. Notifications are deliberately thin: each one names WHAT changed and WHERE to fetch it,
    and the receiver is expected to call the Alto REST API to read current state. Subscriptions are not
    self-serve; a partner emails connectsupport@altosoftwaregroup.co.uk with the integration name, the
    receiving endpoint URL, the event types wanted and the preferred authentication method, and Alto configures
    the subscription manually.'
  contact:
    name: Alto Connect Support
    email: connectsupport@altosoftwaregroup.co.uk
    url: https://developers.vebraalto.com/guides/webhooks/
  externalDocs:
    url: https://developers.vebraalto.com/guides/webhooks/
    description: Alto webhooks guide
defaultContentType: application/json
servers:
  partnerEndpoint:
    host: '{partnerHost}'
    pathname: /{partnerPath}
    protocol: https
    description: The HTTPS endpoint the partner hosts and supplies to Alto during onboarding. Alto is
      the client on this channel; the partner is the server.
    variables:
      partnerHost:
        description: Partner-controlled host, reachable from the public internet.
        default: example.partner.com
      partnerPath:
        description: Partner-controlled path that receives the POST.
        default: alto/webhooks
    security:
    - $ref: '#/components/securitySchemes/xSignature'
    - $ref: '#/components/securitySchemes/basicAuth'
    - $ref: '#/components/securitySchemes/oauth2ClientCredentials'
channels:
  altoNotifications:
    address: /
    title: Alto notifications
    description: A single partner endpoint receives every subscribed event type. Alto sends one HTTP POST
      per notification with Content-Type application/json. The partner routes on the CloudEvents `type`
      field and, where one endpoint serves several integrations, on data.integrationId.
    servers:
    - $ref: '#/servers/partnerEndpoint'
    messages:
      ContactCreated:
        $ref: '#/components/messages/ContactCreated'
      ContactModified:
        $ref: '#/components/messages/ContactModified'
      PropertyCreated:
        $ref: '#/components/messages/PropertyCreated'
      PropertyModified:
        $ref: '#/components/messages/PropertyModified'
      PropertyMarketingInformationSent:
        $ref: '#/components/messages/PropertyMarketingInformationSent'
      BranchModified:
        $ref: '#/components/messages/BranchModified'
      AppointmentCreated:
        $ref: '#/components/messages/AppointmentCreated'
      AppointmentModified:
        $ref: '#/components/messages/AppointmentModified'
      TenancyCreated:
        $ref: '#/components/messages/TenancyCreated'
      TenancyModified:
        $ref: '#/components/messages/TenancyModified'
      TenancyReferencingPassed:
        $ref: '#/components/messages/TenancyReferencingPassed'
      TenancyRenewed:
        $ref: '#/components/messages/TenancyRenewed'
      TenancyVacated:
        $ref: '#/components/messages/TenancyVacated'
      OfferCreated:
        $ref: '#/components/messages/OfferCreated'
      OfferModified:
        $ref: '#/components/messages/OfferModified'
      OfferAccepted:
        $ref: '#/components/messages/OfferAccepted'
      OfferWithdrawn:
        $ref: '#/components/messages/OfferWithdrawn'
      SalesProgressionExchanged:
        $ref: '#/components/messages/SalesProgressionExchanged'
      SalesProgressionMilestoneCompleted:
        $ref: '#/components/messages/SalesProgressionMilestoneCompleted'
      LeadReceived:
        $ref: '#/components/messages/LeadReceived'
      LeadAccepted:
        $ref: '#/components/messages/LeadAccepted'
      LeadModified:
        $ref: '#/components/messages/LeadModified'
      IntegrationEnabled:
        $ref: '#/components/messages/IntegrationEnabled'
      IntegrationDisabled:
        $ref: '#/components/messages/IntegrationDisabled'
      IntegrationActivated:
        $ref: '#/components/messages/IntegrationActivated'
      IntegrationDeactivated:
        $ref: '#/components/messages/IntegrationDeactivated'
operations:
  receiveAltoNotification:
    action: receive
    channel:
      $ref: '#/channels/altoNotifications'
    title: Receive an Alto change notification
    summary: Alto POSTs a CloudEvents 1.0 notification to the partner endpoint.
    description: 'The endpoint must answer 2xx to acknowledge. Alto retries a non-2xx, unreachable or
      timed-out delivery up to 10 times for up to 6 hours from when the change occurred, after which the
      notification is dropped. Delivery order is NOT guaranteed and duplicates are expected: the `id`
      field is stable across retries of the same notification and is the documented de-duplication key.
      Acknowledge fast and process asynchronously. Treat the notification as a signal, then re-fetch the
      resource named by `subject` from the Alto REST API using data.agencyRef as the AgencyRef header.'
    messages:
    - $ref: '#/channels/altoNotifications/messages/ContactCreated'
    - $ref: '#/channels/altoNotifications/messages/ContactModified'
    - $ref: '#/channels/altoNotifications/messages/PropertyCreated'
    - $ref: '#/channels/altoNotifications/messages/PropertyModified'
    - $ref: '#/channels/altoNotifications/messages/PropertyMarketingInformationSent'
    - $ref: '#/channels/altoNotifications/messages/BranchModified'
    - $ref: '#/channels/altoNotifications/messages/AppointmentCreated'
    - $ref: '#/channels/altoNotifications/messages/AppointmentModified'
    - $ref: '#/channels/altoNotifications/messages/TenancyCreated'
    - $ref: '#/channels/altoNotifications/messages/TenancyModified'
    - $ref: '#/channels/altoNotifications/messages/TenancyReferencingPassed'
    - $ref: '#/channels/altoNotifications/messages/TenancyRenewed'
    - $ref: '#/channels/altoNotifications/messages/TenancyVacated'
    - $ref: '#/channels/altoNotifications/messages/OfferCreated'
    - $ref: '#/channels/altoNotifications/messages/OfferModified'
    - $ref: '#/channels/altoNotifications/messages/OfferAccepted'
    - $ref: '#/channels/altoNotifications/messages/OfferWithdrawn'
    - $ref: '#/channels/altoNotifications/messages/SalesProgressionExchanged'
    - $ref: '#/channels/altoNotifications/messages/SalesProgressionMilestoneCompleted'
    - $ref: '#/channels/altoNotifications/messages/LeadReceived'
    - $ref: '#/channels/altoNotifications/messages/LeadAccepted'
    - $ref: '#/channels/altoNotifications/messages/LeadModified'
    - $ref: '#/channels/altoNotifications/messages/IntegrationEnabled'
    - $ref: '#/channels/altoNotifications/messages/IntegrationDisabled'
    - $ref: '#/channels/altoNotifications/messages/IntegrationActivated'
    - $ref: '#/channels/altoNotifications/messages/IntegrationDeactivated'
    bindings:
      http:
        method: POST
components:
  securitySchemes:
    xSignature:
      type: httpApiKey
      name: x-signature
      in: header
      description: Shared secret agreed during onboarding and presented by Alto on every callback. The
        partner rejects any request that does not present the expected value.
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic credentials issued to Alto during onboarding.
    oauth2ClientCredentials:
      type: oauth2
      description: Alto obtains a bearer token from the partner's own authorization server using the client-credentials
        grant and presents it on each request.
      flows:
        clientCredentials:
          tokenUrl: https://partner.example.com/oauth2/token
          availableScopes: {}
      scopes: []
