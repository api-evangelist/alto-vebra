summary: 'The Alto object graph derived from the published OpenAPI path structure and id-reference parameters. Two
  entities are the spine of the whole model: Inventory (a property record — the noun almost everything hangs off)
  and Contact (a party record that plays applicant, vendor, landlord, tenant and owner roles depending on relationship
  rather than type). Listing is a separate projection of Inventory for portal marketing, which is exactly the Alto/Zoopla
  seam. Identifiers are opaque agency-scoped integers with no type prefix and no global property identifier — the
  UK has no MLS and no RESO Universal Property Identifier.'
