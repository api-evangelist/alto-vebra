notes:
- 'Contact is polymorphic by relationship, not by subtype: /owners, /landlords and the tenant identifier lists all
  resolve to contacts. ContactRelationship is the join that carries the role.'
- Inventory vs Listing is the most important distinction in the model. Inventory is the property as the agency holds
  it; Listing is what is marketed, with its own filter, summary, rooms and images operations. Portal distribution
  happens on the Listing side.
- GET /clients is deprecated in favour of /contacts, so the Client entity is collapsing into Contact.
- Charge attaches to both Inventory and Tenancy with the same shape but no shared read operation — there is no GET
  /charges anywhere; charges can be created and never listed through the API.
- The Zoopla product APIs address a listingId (or a customerListingId matched through the Listing Matching Service)
  rather than an Alto inventoryId; nothing in either contract publishes the mapping between the two.
