notes:
- 'Codes 1011007, 1011008, 1021004 and 1021005 encode Zoopla listing QUALITY GATES as API errors: a Premium Listing
  cannot be activated unless the listing has a full description of at least 200 characters and at least 3 images;
  a WFP needs at least 1 image (2011007) and must be in the UK (2011008). The API is where the editorial policy
  is enforced.'
