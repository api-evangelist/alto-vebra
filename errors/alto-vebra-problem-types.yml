gaps:
- No error `type` URI is ever populated, so nothing dereferences to a documented problem type.
- No application/problem+json media type anywhere; RFC 9457 conformance is false.
- The Alto API publishes no numeric error-code register — only HTTP statuses plus prose. The
  Zoopla product APIs do (see errors/alto-vebra-error-codes.yml).
- 401 vs 403 is used consistently and meaningfully (token vs AgencyRef/scope), which is better
  than most; the 403 message string is the only place the distinction is spelled out.
