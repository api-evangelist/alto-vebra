  - errors[].reason
  note: >-
    `code` is a 7-digit integer, not a string — service id (3) + severity (1) + custom code (3).
    See errors/alto-vebra-error-codes.yml for the published register.
- name: Error
  api: Zoopla Leads API
  schema: openapi/zoopla-leads-api-openapi.json#/definitions/Error
