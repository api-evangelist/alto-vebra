  - errors[].message
  note: Used by the Material and PropertyManagement subsystems (31 of the 93 Alto 400 responses).
    Aliased as Alto.Api.Material.Models.Responses.ErrorsResponse and
    Alto.PropertyManagement.Api.Models.Responses.ErrorsResponse.
- name: Errors
  api: Zoopla Premium Listing Activations API, Zoopla Weekly Featured Property (WFP) Activations
    API
  schema: openapi/zoopla-premium-listing-activations-openapi.json#/components/schemas/Errors
  media_types:
