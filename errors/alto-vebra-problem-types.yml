format: rfc7807-shaped
format_note: >-
  Not RFC 9457. The Alto API returns the ASP.NET Core ProblemDetails object
  (type/title/status/detail/instance) — the RFC 7807 shape — but serves it as application/json,
  text/json and text/plain, never as application/problem+json. There is not a single
  problem+json media type anywhere in the four specs, and no error `type` URI is ever populated
  with a resolvable document. A second, incompatible envelope
  ({"errors":[{"code","message"}]}) is used by the Material and PropertyManagement subsystems of
  the same API. Agents must be prepared for both shapes on the same host.
envelopes:
- name: ProblemDetails
  api: Alto API
  schema: openapi/alto-api-openapi.json#/components/schemas/ProblemDetails
  media_types:
  - application/json
  - text/json
  - text/plain
  fields:
  - type
  - title
  - status
  - detail
  - instance
  note: >-
    Also present twice more under the aliases Microsoft.AspNetCore.Mvc.ProblemDetails and
    Alto.PropertyManagement.Api.Models.Responses ProblemDetails — three identical duplicate
    schemas of the same object in one document.
  usage: the dominant 400/401/403 shape across the Alto API
- name: ErrorsResponse
  api: Alto API
  schema: openapi/alto-api-openapi.json#/components/schemas/ErrorsResponse
  media_types:
  - application/json
  fields:
