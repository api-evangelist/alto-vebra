- status: 400
  title: Bad Request
  api: Alto API
  occurrences: 93
  envelope: ProblemDetails | ErrorsResponse
  remediation: >-
    Published guidance: check that the endpoint URL matches the documentation and that all
    required query parameters are present. Spec descriptions add validation detail per operation
    ("Invalid Priority", "invalid date range or missing branch level activation", "invalid
    LeadId", "LinkedType must be set").
  source: https://developers.vebraalto.com/guides/error-codes/
- status: 401
  title: Unauthorized
  api: Alto API
  occurrences: 45
  envelope: ProblemDetails
  meaning: When access has not been granted to the API, or the bearer token is missing/expired.
  remediation: >-
    Published guidance: confirm there is an Authorization header on the request and that the
    bearer token has not expired. Re-request a token from the /token endpoint.
  source: https://developers.vebraalto.com/guides/error-codes/
- status: 403
  title: Forbidden
  api: Alto API
  occurrences: 14
  envelope: ProblemDetails
  meaning: >-
    "Invalid scope or AgencyRef for request." This is the tenancy failure, not the
    authentication failure — the token is valid but is not scoped to the agency, branch or
    property being addressed.
  remediation: >-
    Published guidance: confirm there is an AgencyRef header and that it is the correct agency
    reference. If both are correct, the integration's permissions may not cover the endpoint —
    email connectsupport@altosoftwaregroup.co.uk with the Integration Name so permissions can be
    adjusted.
  source: https://developers.vebraalto.com/guides/error-codes/
