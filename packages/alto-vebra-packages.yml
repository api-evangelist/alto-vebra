summary: >-
  Alto and Zoopla publish no client libraries in any language. Both GitHub organisations exist
  but neither ships an SDK — github.com/AltoSoftware has zero public repositories and
  github.com/zoopla-eng has two unrelated ones (an org profile and a hiring exercise). Neither
  developer site links a package, a code sample repository, or a Postman collection. For a CRM
  with 6,000+ agencies and 39 listed integration partners, every integration in the market is
  hand-rolled REST against the OpenAPI. The only libraries that exist are third-party CMS
  connectors, and the two "zoopla" packages on npm and PyPI wrap the long-retired public Zoopla
  property API, not the current partner APIs in this repo.
