summary: >-
  There is no API changelog. Neither developers.vebraalto.com nor developers.zoopla.co.uk
  publishes a dated release feed, a "what's new" page, or a versioned diff of any kind, and the
  Alto OpenAPI carries a flat info.version of "1.0" that does not move. What Alto does publish
  is a long-running series of PRODUCT release notes — "Alto Upgrade Notes" PDFs on
  files.vebraalto.com — covering the CRM application rather than the API contract. They are not
  indexed: the directory listing is denied and each PDF must be known by filename, so this
  record is a set of confirmed artifacts rather than a complete history.
