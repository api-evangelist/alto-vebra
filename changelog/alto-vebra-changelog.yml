breaking_change_signalling:
  in_spec: >-
    The only change signal inside the contract is a single deprecated operation — GET /clients,
    whose summary reads "This endpoint is now obsolete. Use /contacts endpoint instead." It
    carries deprecated: true. Nothing dates it and nothing says when it will be removed.
  headers: no Sunset or Deprecation header is documented (RFC 8594 not implemented)
  webhooks: >-
    The webhooks guide does commit to forward compatibility on the event payload — "We may add
    fields to the payload over time. Ignore any fields you do not recognise rather than
    failing." That is the only published compatibility promise in the estate.
gaps:
- No dated API changelog on either developer site.
- No index for the product release notes, so consumers cannot discover the current version.
- No Sunset/Deprecation header support and no removal timeline on the one deprecated operation.
