marketSeamNotes: >-
  The United Kingdom has no MLS. Residential listing distribution is a duopoly — Rightmove and
  Zoopla — reached through agency CRM software rather than a shared cooperative database. Alto
  is the largest of those CRMs by agency count and is owned by Houseful Limited, which also owns
  Zoopla, so the same corporate parent owns both a listing pipe and a destination portal. That
  vertical integration is visible in the artifacts: the Alto API and the Zoopla product APIs
  sit on different hosts, different auth servers, and different spec generations, but the
  commercial gate is identical on both sides. The inverse of the United States holds: there is
  no industry standard (no RESO, no NAR, no mandated machine-readable contract), yet the
  contracts that do exist are published openly and are of high quality. The open data layer the
  US lacks and the UK has sits entirely with government — HM Land Registry Price Paid Data and
  ownership datasets, and Ordnance Survey addressing and mapping — none of which Alto touches
  in its published API surface.

conclusions:
  status: built
  developerPortal: https://developers.vebraalto.com/
  portalConfirmed: true
  portalCaveat: >-
    The portal is a real, live, anonymous 200 with a complete downloadable spec — it is not a
    member login. Alto Connect (connect.vebraalto.com) is the member login and is a separate
    surface. Confirming the portal does NOT confirm the data is reachable.
  specsHarvested: 4
  gated: true
  accessGate: partner-only
  openData: false
  resoCertified: false
  headline: >-
    Certification is not reachability, and here neither exists in the certified sense — but the
    contract is genuinely open even though the data is entirely closed. Alto proves the two
    facts are independent: a UK CRM with zero RESO involvement publishes a better anonymous
    machine-readable contract than many RESO-certified US endpoints, while remaining strictly
    partner-only for actual access.

