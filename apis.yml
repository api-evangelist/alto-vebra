apis:
- aid: alto-vebra:alto-api
  name: Alto API
  description: >-
    The full Alto REST API for UK estate agency operations — 95 documented paths across 27
    resource families covering contacts and applicants, property inventory, listings and media,
    appraisals and valuations, appointments and viewings, leads, offers, sales progression,
    lettings progression, tenancies, landlords and owners, work orders, suppliers, documents,
    file notes, branches, negotiators and partner integration status. OpenAPI 3.0.4 with a
    sandbox and a production server, Bearer JWT obtained via OAuth2 client-credentials against
    the /token endpoint, an AgencyRef header scoping every call to one agency, and route-level
    scopes of the form alto/read:contacts and alto/route:get-inventory.
  humanURL: https://developers.vebraalto.com/api
  baseURL: https://api.alto.zoopla.co.uk
  tags:
