- aid: alto-vebra:zoopla-leads-api
  name: Zoopla Leads API
  description: Swagger 2.0 poll API for retrieving applicant leads and appraisal (valuation) leads generated
    on the Zoopla portal, published by Houseful for contracted Zoopla agency customers and their software
    partners. OAuth2 client-credentials against services-auth.services.zoopla.co.uk with the scopes leads/list:applicant-leads
    and leads/list:appraisal-leads. A push variant is documented alongside the poll contract.
  humanURL: https://developers.zoopla.co.uk/leads/reference/api
  baseURL: https://services.zoopla.co.uk
