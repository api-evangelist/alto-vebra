aid: alto-vebra
url: https://raw.githubusercontent.com/api-evangelist/alto-vebra/refs/heads/main/apis.yml
name: Alto (Vebra / Zoopla)
kind: company
description: 'Alto — formerly Vebra Alto, and still trading through vebra.com — is the United Kingdom''s
  most widely deployed estate agency CRM, used by more than 6,000 sales and lettings agency branches to
  run valuations, listings, applicant matching, offers, sales and lettings progression, tenancies, property
  management, work orders and client accounting. It is owned by Houseful Limited, the parent of the Zoopla
  portal, which places Alto at the exact chokepoint of the UK residential market — the country has no
  MLS, so listings reach Rightmove and Zoopla through agency CRM software rather than a shared cooperative
  database, and Alto is the largest of those pipes. Its API posture is genuinely strong on the contract
  side and closed on the access side: Alto publishes an open, unauthenticated developer portal at developers.vebraalto.com
  carrying a complete OpenAPI 3.0.4 document (95 paths, 112 operations across 27 resource families) served
  verbatim from api-docs.vebraalto.com, alongside 26 documented CloudEvents 1.0 webhook event types and
  101 published OAuth scope strings. But credentials are partner-only — a developer must register an integration
  in Alto Connect, be bound by an existing contract with Vebra Solutions, and then wait for an individual
  agency to activate the integration and issue an AgencyRef before a single call can be made. Sibling
  Zoopla portal product APIs (Leads, Premium Listing Activations, Weekly Featured Property) are documented
  publicly at developers.zoopla.co.uk with downloadable specs but are likewise restricted to contracted
  Zoopla agency customers. There is no SDK, CLI, Postman collection, MCP server or status page anywhere
  in the estate, and no RESO Web API or Data Dictionary certification exists — RESO is a North American
  NAR-driven standard with no UK counterpart. Alto publishes no open data; the UK''s open property layer
  sits with HM Land Registry and Ordnance Survey, not with the private CRM duopoly feeders.'
imageNote: >-
  The `image` property was removed on 2026-08-26. It had been copied verbatim out of a
  bootstrap template and pointed at an icon belonging to groq, not to this company.
  That asset returns HTTP 200, so the record rendered another company's brand
  rather than a broken image, which is why it went unreported (roadmap#153).
  No correct icon has been sourced yet. Shipping the wrong company's mark is worse
  than shipping none; re-run the icon backfill once a real asset exists.
