name: Alto (Vebra / Zoopla)
kind: company
description: >-
  Alto — formerly Vebra Alto, and still trading through vebra.com — is the United Kingdom's most
  widely deployed estate agency CRM, used by more than 6,000 sales and lettings agencies to run
  valuations, listings, applicant matching, offers, sales and lettings progression, tenancies,
  property management, work orders and client accounting. It is owned by Houseful Limited, the
  parent of the Zoopla portal, which places Alto at the exact chokepoint of the UK residential
  market — the country has no MLS, so listings reach Rightmove and Zoopla through agency CRM
  software rather than a shared cooperative database, and Alto is the largest of those pipes.
  Its API posture is genuinely strong on the contract side and closed on the access side: Alto
  publishes an open, unauthenticated developer portal at developers.vebraalto.com carrying a
  complete OpenAPI 3.0.4 document (95 paths across 27 resource families) served verbatim from
  api-docs.vebraalto.com, alongside 24 documented CloudEvents 1.0 webhook event types. But
  credentials are partner-only — a developer must register an integration in Alto Connect, be
  bound by an existing contract with Vebra Solutions, and then wait for an individual agency to
  activate the integration and issue an AgencyRef before a single call can be made. Sibling
  Zoopla portal product APIs (Leads, Premium Listing Activations, Weekly Featured Property) are
  documented publicly at developers.zoopla.co.uk with downloadable specs but are likewise
  restricted to contracted Zoopla agency customers. No RESO Web API or Data Dictionary
  certification exists — RESO is a North American NAR-driven standard with no UK counterpart —
  and Alto publishes no open data; the UK's open property layer sits with HM Land Registry and
  Ordnance Survey, not with the private CRM duopoly feeders.
