summary: >-
  Alto's conformance profile is narrow and honest: OAuth 2.0 client credentials, OpenAPI 3.0.4,
  and a genuine CloudEvents 1.0 webhook envelope. Everything property-industry-specific is
  absent — there is no RESO Web API, no RESO Data Dictionary, no OData, and no UK equivalent,
  because the United Kingdom has no MLS and no NAR-style body mandating a machine-readable
  standard. No compliance certification (SOC 2, ISO 27001, PCI DSS) is published anywhere on
  the Alto, Vebra, Houseful or Zoopla developer or marketing surfaces.
